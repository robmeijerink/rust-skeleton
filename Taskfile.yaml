version: "3"

includes:
  local:
    taskfile: Taskfile.local.yml
    optional: true

vars:
  COMPOSE: docker compose -f .devcontainer/docker-compose.yml
  CARGO: "{{.COMPOSE}} run --rm app cargo"
  # Adds the secret-file masks that agent:masks generates on every start
  AGENT: "{{.COMPOSE}} -f .devcontainer/.agent-masks.yml"

# Unique Compose project per checkout (matches the name VS Code Dev Containers uses)
env:
  COMPOSE_PROJECT_NAME: '{{regexReplaceAll "[^a-z0-9_-]" (lower (base .ROOT_DIR)) ""}}_devcontainer'
  # Sandbox user: your uid on Linux so it can write to the project; 1000 on macOS (bind mounts
  # ignore it there, and a change would lock the existing agent volumes). Never root.
  AGENT_UID:
    sh: '[ "$(uname -s)" = Linux ] && [ "$(id -u)" != 0 ] && id -u || echo 1000'

tasks:
  # ==========================================
  # 💻 SYSTEM
  # ==========================================
  default:
    desc: Open the interactive task menu
    silent: true
    cmds:
      - task: search

  search:
    desc: Open the interactive task menu
    silent: true
    cmds:
      - |
        CHOICE=$(task --list | grep '^\*' | grep -vE 'default|search' | fzf --reverse --border="rounded" --prompt="🚀 Search Task: " --pointer="👉")
        if [ -n "$CHOICE" ]; then
          TASK_NAME=$(echo "$CHOICE" | awk '{print $2}' | sed 's/:$//')
          echo -e "\033[1;32mRunning:\033[0m task $TASK_NAME\n"
          task "$TASK_NAME"
        fi

  volumes:
    desc: Create the toolchain and crate cache volumes shared by all projects
    internal: true
    silent: true
    run: once
    cmds:
      - docker volume create rust_cargo > /dev/null
      - docker volume create rust_rustup > /dev/null

  init:
    desc: Rename the project (task init -- my-project)
    deps: [volumes]
    cmds:
      - |
        NAME="{{.CLI_ARGS}}"
        if [ -z "$NAME" ]; then echo "Usage: task init -- <project-name>"; exit 1; fi
        if ! echo "$NAME" | grep -Eq '^[a-z][a-z0-9_-]*$'; then
          echo "Invalid name '$NAME': use lowercase letters, digits, - and _, starting with a letter"; exit 1
        fi
        SNAKE=$(echo "$NAME" | tr '-' '_')
        for f in Cargo.toml src/main.rs src/lib.rs .devcontainer/devcontainer.json; do
          sed -i.bak "s/rust-skeleton/$NAME/g; s/rust_skeleton/$SNAKE/g" "$f" && rm "$f.bak"
        done
        {{.CARGO}} check --quiet
        echo "Renamed project to: $NAME"

  # ==========================================
  # 🚀 MAIN
  # ==========================================
  agent:masks:
    desc: Hide every .env-style file in the project from the agent
    internal: true
    silent: true
    # A bind mount can't use a glob, so list the files that exist now. Only existing files get a mask:
    # mounting over a missing file would make Docker create an empty one in the project. A secret file
    # created while the sandbox runs is masked after the next `task agent`. .env.example stays readable.
    cmds:
      - |
        files=$(find . \( -path ./target -o -path ./.git -o -path ./node_modules \) -prune -o -type f \
          \( -name '*.env' -o -name '.env.*' \) ! -name '.env.example' -print)
        if [ -z "$files" ]; then
          echo 'services: {}' > .devcontainer/.agent-masks.yml
        else
          # One path per line (not word-split), quoted in the YAML, so names with spaces work too
          { echo 'services:'; echo '  agent:'; echo '    volumes:'
            echo "$files" | while IFS= read -r f; do echo "      - \"/dev/null:/app/${f#./}:ro\""; done
          } > .devcontainer/.agent-masks.yml
        fi

  agent:prepare:
    desc: Create what the sandbox mounts if it doesn't exist yet
    internal: true
    silent: true
    cmds:
      # Mounted read-only, so it must exist as a file (Docker would create a directory); a bare version line is a valid Taskfile
      - '[ -e Taskfile.local.yml ] || printf "version: \"3\"\\n" > Taskfile.local.yml'
      - docker volume create ai-skills-provider > /dev/null
      - docker volume create ai-instructions-provider > /dev/null

  agent:
    desc: Start Claude Code in the sandbox (task agent -- <claude args>)
    deps: [agent:prepare, agent:masks]
    cmds:
      - "{{.AGENT}} up -d --build agent"
      - "{{.AGENT}} exec agent claude {{.CLI_ARGS}}"

  agent:update:
    desc: Rebuild the sandbox with the latest Claude Code
    deps: [agent:prepare, agent:masks]
    cmds:
      - "{{.AGENT}} build --pull --no-cache agent"
      - "{{.AGENT}} up -d --force-recreate agent"

  dev:
    desc: Start the app and restart on file changes (via Docker Compose)
    deps: [volumes]
    cmds:
      - "{{.COMPOSE}} up"

  run:
    desc: Run the app once (task run -- <args>)
    deps: [volumes]
    cmds:
      - "{{.CARGO}} run -- {{.CLI_ARGS}}"

  test:
    desc: Run project tests
    deps: [volumes]
    cmds:
      - "{{.CARGO}} test"

  check:
    desc: Format the code, then lint and test
    silent: true
    # One container and quiet output: this is the feedback loop for AI agents, every line costs tokens.
    # Formats instead of only checking, so agents never spend a round trip on formatting (CI still checks).
    deps: [volumes]
    cmds:
      - "{{.COMPOSE}} --progress quiet run --rm app sh -c 'cargo fmt --all && cargo clippy -q --locked --all-targets -- -D warnings && cargo test -q --locked'"

  fmt:
    desc: Format the code
    deps: [volumes]
    cmds:
      - "{{.CARGO}} fmt --all"

  cargo:
    desc: Run any cargo command (task cargo -- add serde --features derive)
    deps: [volumes]
    cmds:
      - "{{.CARGO}} {{.CLI_ARGS}}"

  build:
    desc: Build the production Docker image
    cmds:
      - docker build -t {{regexReplaceAll "[^a-z0-9_.-]" (lower (base .ROOT_DIR)) ""}} .

  clean:
    desc: Remove build artifacts (app and sandbox) and shut down containers
    cmds:
      - "{{.COMPOSE}} --profile agent down"
      # Build output lives in volumes (`cargo clean` can't remove a mount point); remove them after
      # `down` so no container still uses them. Not `down --volumes`: that would also drop the login.
      - |
        for VOL in "${COMPOSE_PROJECT_NAME}_target" "${COMPOSE_PROJECT_NAME}_agent_target"; do
          if docker volume inspect "$VOL" > /dev/null 2>&1; then docker volume rm "$VOL" > /dev/null; fi
        done
