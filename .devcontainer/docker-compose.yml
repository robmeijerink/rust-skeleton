services:
  app:
    image: rust:1-trixie
    working_dir: /app
    # Forward signals to the app so `docker compose stop` is instant instead of a 10s SIGKILL
    init: true
    volumes:
      - ../:/app
      # Toolchain and crate cache are shared by all projects (like a local ~/.cargo and ~/.rustup)
      - cargo:/usr/local/cargo
      - rustup:/usr/local/rustup
      # Build output stays per project (also much faster than a bind mount on macOS)
      - target:/app/target
    # Install watchexec on-the-fly (cached after first time) and restart the app on changes.
    # Polling is used because file events don't reliably cross bind mounts on macOS. Add -w <dir> for extra source dirs.
    command: sh -c "cargo install --locked watchexec-cli@2.8.0 && watchexec -r --poll 500ms -w src -w Cargo.toml -- cargo run"
    # Bound to localhost only; the app itself must listen on 0.0.0.0 inside the container
    ports:
      - "127.0.0.1:8080:8080"

  # Sandbox for Claude Code (`task agent`): sees only this project (see docs/decisions/002-agent-sandbox.md)
  agent:
    build:
      context: ..
      dockerfile: Dockerfile.dev-agent
      args:
        UID: ${AGENT_UID:-1000}
    # Only started by name (`task agent`), not by `task dev` or a plain `compose up`
    profiles: [agent]
    working_dir: /app
    init: true
    command: sleep infinity
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    volumes:
      - ../:/app
      # The mounts below are read-only. Otherwise the agent could break out of the sandbox by editing
      # files that the host later runs or reads: git hooks, Taskfile, compose files and Claude Code
      # hooks (.claude/). A read-only .git also stops the agent from committing; `git status`,
      # `git diff` and `git log` still work.
      - ../.git:/app/.git:ro
      - ../Taskfile.yaml:/app/Taskfile.yaml:ro
      - ../.devcontainer:/app/.devcontainer:ro
      - ../.claude:/app/.claude:ro
      - ../Taskfile.local.yml:/app/Taskfile.local.yml:ro
      # Secret files (.env, .env.*, *.env) are not visible to the agent: `task agent` generates an
      # extra compose file that masks them (not listed here).

      # Separate volumes for cargo, rustup and target instead of the shared rust_* ones, so the agent
      # can't modify the toolchain and crate cache that your other projects use.
      - agent_cargo:/usr/local/cargo
      - agent_rustup:/usr/local/rustup
      - agent_target:/app/target
      # Claude login: log in once with /login, it survives restarts and rebuilds
      - agent_claude:/home/agent/.claude
      # Optional personal skills (see README), read-only so the agent can't change them
      - ai-skills-provider:/home/agent/.claude/skills:ro
      # Optional personal instructions (see README), read-only as well
      - ai-instructions-provider:/opt/ai-instructions:ro

  # Add local infrastructure (databases, queues, ...) here.

volumes:
  # Personal skills shared by all projects; created empty by `task agent`
  ai-skills-provider:
    external: true
  # Personal instructions shared by all projects; created empty by `task agent`
  ai-instructions-provider:
    external: true
  # Created by `task` and the Dev Container's initializeCommand
  cargo:
    name: rust_cargo
    external: true
  rustup:
    name: rust_rustup
    external: true
  target:
  agent_cargo:
  agent_rustup:
  agent_target:
  agent_claude:
