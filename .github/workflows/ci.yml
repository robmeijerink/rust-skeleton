name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Format, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Installs the toolchain from rust-toolchain.toml, caches builds and sets RUSTFLAGS="-D warnings"
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked

      - name: Run Tests
        run: cargo test --locked

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Catches crates that build in the dev container but not in the slim production image
      - name: Build Image
        run: docker build .
